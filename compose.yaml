name: jobpulse

x-app: &app
  build: .
  image: jobpulse:local
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME:-jobpulse}
    DB_USER: ${DB_USER:-jobpulse}
    DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and configure DB_PASSWORD}
    DB_CONNECT_TIMEOUT: "5"
    JOBPULSE_SOURCES: ${JOBPULSE_SOURCES:-python.org}
    JOBPULSE_GREENHOUSE_BOARDS: ${JOBPULSE_GREENHOUSE_BOARDS:-[]}
    JOBPULSE_LEVER_BOARDS: ${JOBPULSE_LEVER_BOARDS:-[]}
    JOBPULSE_ASHBY_BOARDS: ${JOBPULSE_ASHBY_BOARDS:-[]}
    JOBPULSE_HTTP_PACE_SECONDS: ${JOBPULSE_HTTP_PACE_SECONDS:-0.25}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
    AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-gemini-embedding-001}
  init: true

services:
  db:
    image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: ${DB_NAME:-jobpulse}
      POSTGRES_USER: ${DB_USER:-jobpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["python", "-m", "jobpulse.database.migrate", "upgrade"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6

  ingest:
    <<: *app
    profiles: ["ingestion"]
    command: ["python", "-m", "jobpulse.ingestion.pipeline"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  frontend:
    build: ./frontend
    image: jobpulse-frontend:local
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
