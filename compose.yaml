name: jobpulse

x-app: &app
  build: .
  image: jobpulse:local
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME:-jobpulse}
    DB_USER: ${DB_USER:-jobpulse}
    DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and configure DB_PASSWORD}
    DB_CONNECT_TIMEOUT: "5"
  init: true

services:
  db:
    image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: ${DB_NAME:-jobpulse}
      POSTGRES_USER: ${DB_USER:-jobpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["python", "-m", "jobpulse.database.migrate", "upgrade"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6

volumes:
  postgres-data:
